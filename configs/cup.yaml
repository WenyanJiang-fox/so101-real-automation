# 白瓷茶杯那一局：场上三件 —— 白杯子（目标）、红方块、蓝球（干扰项）。
#
# 跟 default.yaml 只差 `objects:` 这一处。**这一份清单就是仿真的建场依据、
# 感知的词表、判官算落地高度的依据**，一处改三处一起变。
#
# 尺寸为什么是 45mm：夹爪开合行程 30.9mm（合）~ 55.9mm（开），比 55.9mm 宽的
# 东西根本夹不住，所以杯子直径取 45 —— 留出合爪的余量。真机那只瓷杯按实测填。
arm:    sim
cams:   [sim_wrist, sim_overhead]

objects:
  # 杯子。`cup: true` = 顶上 25% 那圈口沿不许夹，抓法会从杯壁中部起试。
  # 仿真里它是个**实心圆柱**（一个视角看不出里面是空的），`height_mm` 必须等于
  # `diameter_mm`，不等会当场报错 —— 实心/空心只影响「夹哪儿合法」。
  - {shape: cylinder, color: white, diameter_mm: 45, height_mm: 45, cup: true}
  - {shape: cube,     color: red,   side_mm: 30}
  - {shape: sphere,   color: blue,  diameter_mm: 40}

perception: siglip2
policy: expert
judge:  truth

rounds: 1
seed:   0
