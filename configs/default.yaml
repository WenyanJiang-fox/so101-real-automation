# 一套配置说清楚「用哪几个实现」。换一样，只改这里一行。

arm:    sim                          # 机械臂：sim（将来还有 real）
cams:   [sim_wrist, sim_overhead]    # 相机可以有多个，按名字找实现

# 感知：看着俯视画面，按指令说「要抓的是哪一块、它在哪」。
#   nearest  不看指令，取离工位坐标最近的那块（基线，不依赖任何模型）
#   siglip2  拿一句话去挑（2025 年的 SigLIP 2）
#   clip     老基线（2021 年的 CLIP），留着跟上面那代对着看
perception: siglip2

policy: expert                       # 策略：expert / smolvla / llm
judge:  truth                        # 判官：truth（仿真真值）/ threshold（真机界线）

# 桌上摆什么。**留空 = 老口径**：三块 30mm 方块（红绿蓝），跟以前的跑法逐字节一样。
# 写了就以它为准。一行一件，`shape` 支持 cube / cylinder / sphere，尺寸写毫米：
#   objects:
#     - {shape: cylinder, color: white, diameter_mm: 45, height_mm: 45, cup: true}
#     - {shape: cube,     color: red,   side_mm: 30}
#     - {shape: sphere,   color: yellow, diameter_mm: 40}
# 这一份清单**三处共用**（都是 `core/geom.object_specs()`）：仿真照它建场景、感知照它
# 建词表（所以「白色圆柱」认得出来）、判官照它算「躺平有多高」。改它一处，三处一起变。
# 注意：仿真的圆柱/球只能填满一个方盒，`height_mm` 必须等于 `diameter_mm`，不等会当场报错。

rounds: 2                # 跑多少轮
seed:   0

# 停止条件。0 / 留空 = 不管这一条。三条口径见 `impls/policy_expert.py` 的注释。
max_attempts: 3           # 一轮里「抓一次+放一次」最多试几次。试满就收工 —— 这就是
                          # 「抓几次都没抓起来」那一条。
attempt_seconds: 60       # **一次尝试**最多多少秒（墙钟）。搜圈、换相机都算在这 60 秒里。
                          # 2026-10-12 从 30 提到 60：同一条路径，之前跑一整轮 314 帧 / 22.3s，
                          # 那天那次 161 帧就花了 40.8s —— 每步的墙钟会随机器当天的快慢变 3 倍，
                          # 30 秒砍掉的不一定是坏轮次。这个上限本身仍然怕机器变慢，想要一个不随
                          # 机器快慢变的就接 `max_steps_per_round`。
round_seconds: 200        # **整轮**总上限。3 × 60 = 180 秒已经是硬顶，这一条只防「次数没扣对」
                          # 那种漏洞，正常永远轮不到它。**跟着 60 一起提上来的** —— 留在 120
                          # 的话它会抢在第 2 次尝试中间把这一轮砍掉。
max_steps_per_round: 3000  # **目前没人读**（只写在配置里）。想要一个不随机器快慢变的兜底就接它。
