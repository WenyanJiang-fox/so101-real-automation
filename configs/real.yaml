# 真机那一套。跟 `default.yaml` 的差别只有「用哪几个实现」+ 一段真机现场常数。
#
#     G:/anaconda/envs/sim2real/python.exe run_sim.py --config configs/real.yaml --rounds 1 --whole --fps 10
#
# **`--fps` 必须显式给。** 主循环默认按仿真的 50Hz 算回放速度，真机一个控制步
# ≈ 读 66ms + 写 21ms + 逆解 ≈ 0.1 秒，不写 `--fps` 录出来的视频会快 5 倍。

arm:  real                      # `real/arm.py`（走 COM 串口，读的是官方 so101_new_calib.xml）
cams: [real_wrist]              # `real/cameras.py`（腕上那一路；俯视那一路这一版不接）

perception: brown_rect          # `real/perception.py`（棕色矩形 + 标定反推世界坐标）
policy:     real                # `impls/policy_real.py`（只有抓取这一段）
judge:      held                # `impls/judge_held.py`（只判「抓起来、抬起没掉」）
goal:       grasp               # 这一轮不判放置

rounds: 1                       # 真机一轮 = 手动摆一次件
seed:   0

# 桌上摆的就是那一件。`side_mm` 是立方体的**边长全长**（毫米，见 `core.shapes.from_spec`
# 的 `cube` 一支）—— **这个数要按手上那只方块核一遍再跑**：它决定感知投剪影时的形状、
# 以及「方块中心躺在桌面上多高」（`rest_z`），量错了反推出来的 z 和重合度判据一起错。
# **颜色也要在这里对**：真机感知用的 HSV 区间是 `thresholds.json` 的
# `color.hsv.<这个颜色>`，那个键没标定过会当场抛，不会拿别的颜色的区间去认。
objects:
  # 2026-10-17：桌上换成绿色长方体。**`size_mm` 这三个数是种子、不是量出来的** ——
  # 画面会把形状和尺寸估一遍（`core/vision.py::estimate_shape`，梯子 20~40mm 边长、
  # 16~40mm 高），估出来之后就全用它（`skills/pick_real.py::_box_half_m` 也优先用它）。
  # 这三个数只在估不出来的时候当退路，以及决定起搜时那个水平面。
  - {shape: box, color: green, size_mm: [40, 30, 20]}
  # 换成红方块把上面那行注释掉、这行放开：
  # - {shape: cube, color: red, side_mm: 18}
  # 换成圆柱就把它换成下面这行、把上面那行注释掉。
  # **直径、高、颜色这三样都还没定**，得按手上那根实体量一遍再填 —— 我这边不猜数
  # （填错了反推出来的 z 和重合度判据会一起错，而且 `color` 那个键在
  # `thresholds.json` 里没标定过会当场抛）。代码那一侧 2026-10-17 已经能认
  # `diameter_mm` / `height_mm` 了（`skills/pick_real.py::_box_half_m`），
  # 形状本身（`sh.normal` / `sh.support` / `rest_z`）本来就是走 `shapes.from_spec` 的。
  # - {shape: cylinder, color: ???, diameter_mm: ??, height_mm: ??}

# 停止条件。**秒数一律 0 = 不管这一条**（见 `impls/policy_real.py::deadline`）——
# 一次尝试里要扫 4 个平移点 + 20 个抬头姿态，每个姿态都要走过去再拍一眼，180 秒
# 只够走到一半；掐在中间停手等于白扫。
max_attempts:   1               # **1 = 一次实验只合一趟爪。** 2026-10-15 用户定：真机上
                                # 反复试会连着好几趟离谱的落点（run_real_28 第 2、3 趟快
                                # 够到别的方块了），一次就够。要重试由人决定，不自动重来。
attempt_seconds: 0              # 0 = 不看秒表，一次尝试跑完为止
round_seconds:   0              # 0 = 不看秒表，整轮跑完为止

# ---- 真机现场常数 ----
# 这三样主循环在 `make()` 之前读出来、填进 `core.geom`（口径跟仿真在 `core/geom.py`
# 里写死的 `PICK_XY` / `CUBE_Z` 一模一样 —— 仿真也不问人，就是几个常数放在那儿）。
# **缺一样就当场抛**，不拿猜的坐标去驱动机械臂。
real:
  port: COM10                   # 从臂（COM12 是以前那根）
  cam_index: 1                  # 腕相机。**2026-10-20 回退到没有侧相机的版本时仍是 1**：
                                # 10 月 19 日新插的 USB 侧相机占着 index 0，腕相机被挤到 1。
                                # 代码这一侧已经不建侧相机的实现了，但那个 USB 设备还插着，
                                # 枚举序号不会自己让开 —— 所以这里写 1，不是旧版的 0。
                                # 拔掉侧相机之后腕相机会退回 0，那时这一行要跟着改。
                                # 序号是系统枚举出来的，插拔一次就可能变，认不出画面时先查这里。

  # 桌面在**臂基座坐标系**里多高（毫米）。感知反推方块 x,y 的那个水平面就是它。
  # 仿真这边等价物是 z=0 的地面；真机上桌面就是那个面。
  #
  # **2026-10-15 由用户定为 −22。** 原来写的 −9 是 `real/mount_check.py` 复算 ChArUco
  # **板面**读到的值 —— 那是平板的**上表面**，板本身有厚度，这一截从来没算进去。而这
  # 个数一路被当成「桌面」用在两处：下探终点的高度（爪尖停在桌面之上半个方块高），
  # 和感知把画面里的方块反推成水平坐标时用的那个平面。错了就两处一起错。
  #
  # 改的依据两条，互相差 2.9mm：
  #   * 用户目视：`out/run_real_28.log` 第 1 趟爪尖停在 z=−1.0mm 时，它离方块下底面
  #     还有约 20mm → 底面（= 桌面）在 −21mm。
  #   * `_probe_table_z.py --go` 从初始位置垂直下压，衰减前最后一个跟得住的读数
  #     −23.9mm（`out/probe_table_z.log`）。
  # 取中间，−22。
  table_z_mm: -22

  # 盒子大致摆在哪（毫米，基座系 x,y）。它是 `core.vision.estimate_pose` 的起搜中心
  # （±30mm 网格），每次把盒子摆在这一带。**这个坐标就是仿真那个拾取工位**
  # （`core/geom.py` 的 `PICK_XY[0]`，半径 200mm、方位 20°，可达环 130~260mm 的中段）。
  pick_xy_mm: [227, 68]

  # 腕相机反推出来的世界坐标要**扣掉**的固定偏移（毫米，基座系 x,y）。
  # 2026-10-15 实测：不扣的话 x 恒比真实位置大 35.8mm（三次记录一致：手摆夹住那趟
  # +31.1、悬停那趟 +36.5、专门对齐那趟 +35.8，`out/ref_pose_align.json`）—— 用户
  # 目视逐次确认「固定爪尖正在方块正上方」时爪尖在 x=199.7，而感知说方块在 x=235.5。
  # 不扣的后果就是每趟落点都往 +x 多走 36mm、爪子落在方块后面合爪（run_real_25/26 六趟全 empty）。
  # **还没验过换腕转/换方位后这个偏移会不会跟着转**，三次都在腕转 −80° 附近量的。
  percep_offset_mm: [35.8, 0.0]

  # 舵机速度档。0 = 舵机自己最快。**没在真机上标过**，第一次上机按实走的结果重定。
  speed: 0

  # **去掉驱动里两处固定等待**（2026-10-20 用户定）：读 65.7→1.28ms、写 21.5→0.59ms。
  # 送出去的位置指令、读回来的值都不变（`scripts/probes/fps_probe_result.json`）；变的是指令密度，
  # 走位从约 10Hz 回到设计的 30Hz。代价：某个舵机不回应时是忙等。
  fast: true

# ---- 自动采集数据（2026-10-20 用户定）----
# 面板上按「采集」才用这一段；不按就一个字段都不读。**侧相机只进数据、不帮抓取**：
# 它固定在三脚架上，没有标定、没有机位，感知那条链根本不看它。
#
# **`root` 和 `repo_id` 是按「有两路相机」定的。** LeRobot 把 feature 写死在
# `meta/info.json` 里，腕相机那份（`so101_real_grasp_960_4hz`）只有 camera1，
# 往里续写两路的数据会当场报错 —— 所以这是另一个目录，不是接在原来那份后面。
collect:
  root: G:\sim2real\so101-real-harness\datasets\so101_real_grasp_2cam_4hz
  repo_id: so101_real/pick_grasp_2cam
  fps: 4                        # 0.2 秒的采样闸口隔一步录一帧，和腕相机那份同一个口径
  size: 960x540                 # 腕相机存多大（等比缩，不压扁）
  side_cam:
    index: 0                    # 10 月 19 日插的那只 USB 侧相机
    crop: [600, 180, 1460, 1080]  # 只留白纸、方块、机械臂；左边地面和右边柱子剪掉
    rotate: 180                 # 相机倒着架的；两组数和 view_cam.py 里调好的同一套
