# 真机那一套代码跑在仿真臂上：技能 / 感知 / 判官全是真机那份，机械臂换成仿真替身。
#
# 用途只有一个：**核对「仿真知道的有没有比真机多」**。这里跑出来的每一眼、每一个
# 判据，都是真机现场能拿到的那几样 —— 腕相机 + 相机标定、6 号舵机角度、关节读数。
# 没有方块真值坐标、没有指垫接触点、没有 `bump_scan`。
#
# 跑法（整轮一个视频）：
#   G:/anaconda/envs/sim2real/python.exe run_sim.py --config configs/sim_real.yaml --rounds 1 --whole
#
# 和 `configs/real.yaml` 逐字对齐，只换两处：`arm` 换成仿真的、`real_stack` 打开。

arm: sim_real
# 真机那一支的实现（`impls/policy_real.py` / `real/perception.py` / `skills/pick_real.py`
# / `impls/judge_held.py`）不在默认导入里（`run_sim.py` 开头那段）。这一个开关把它们
# 装上，并把下面 `real:` 那两个现场常数生效 —— 感知反投影要用。
real_stack: true

# **只有腕机这一路。** 真机上就这一台；仿真里给它挂俯视相机，等于白送真机没有的
# 视角，这一轮的结论当场作废。
cams:
  - sim_wrist

# `brown_rect` 是在真机上写的，默认盯 `real_wrist`。仿真这一路的键名不一样，得写明。
perception_cam: sim_wrist
perception: brown_rect
policy: real
judge: held
goal: grasp

rounds: 1
seed: 0
# 用户 2026-10-15 定：一个实验只准合一趟爪。仿真这一支也照这个口径 —— 要试「让开量
# 纠位收不收敛」就看第一趟，重试会把日志搅浑。
max_attempts: 1

# 时间上限放宽：仿真一步是 50Hz 的物理时间，但真机那一套里 `grasp_check.measure_empty`
# 有 `time.sleep(0.8)`、`joint_move` 有 30Hz 的墙钟节拍，整轮实际要跑几分钟。
attempt_seconds: 900
round_seconds: 3600

# 桌上这一件。**颜色在这儿写一次就行** —— `brown_rect` 按这个字段去
# `thresholds.json` 里取 HSV 区间（`color.hsv.red` 2026-10-14 标过），形状和尺寸拿它
# 投剪影量位姿。类名叫 brown_rect 是历史，它认的是配置里这一行。
objects:
  - shape: cube
    color: red
    side_mm: 20

# 真机现场那两个常数（`configs/real.yaml` 里同一段）。仿真里：
#   table_z_mm  方块躺的地面在臂基座系的高度 —— nexus 这个场景的地面就是 z=0。
#   pick_xy_mm  盒子大致摆在哪。nexus 在这一圈（圆心 0.039、半径 0.13~0.26）里随机
#               摆，所以这是个**起搜中心**、不是答案：进场照它走，看一眼量准了再纠位。
real:
  table_z_mm: 0
  pick_xy_mm: [200, 0]
