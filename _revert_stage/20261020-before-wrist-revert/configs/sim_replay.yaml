# 把**真机上一趟跑出来的那串坐标**放回仿真里，让仿真把那一趟该走的路走一遍。
#
# 用途：真机那一趟（`out/run_real_13.log`）看准了盒子在哪，但臂走不动 —— 进场、
# 纠位、下探三段全部 stall。仿真臂走得动，所以把同一组数搬过来，看「如果盒子真在
# 那个位置，这条路走不走得通」。
#
# 搬过来的数（`out/run_real_13.log` 第 21 行，真机腕相机量出来的）：
#     盒子在 x=239 y=47 z=-1mm、yaw -42.7°
# 用 `--pick-offset` 让 `park` 把盒子摆到那儿（工位坐标是 227:68，差 +12:-21mm）：
#     G:/anaconda/envs/sim2real/python.exe run_sim.py --config configs/sim_replay.yaml \
#         --rounds 1 --single --steps park,pick_real \
#         --pick-offset 12.06:-21.40 --yaw-deg -42.7 --whole
#
# 和 `configs/sim_real.yaml` 的差别只有三处，都是为了「看得见」：
#   1. `pick_xy_mm` 改回真机那份 `configs/real.yaml` 的 [227, 68] —— 这才是那一趟
#      进场时照着走的坐标（sim_real 原来写的 [200, 0] 是另一个起搜中心）。
#   2. 相机多挂一路俯视的 —— `sim_real` 只留腕机是为了「真机有什么就只给什么」，
#      这一份是演示，得看得见臂怎么走。
#   3. 下面这段注释。

arm: sim_real
real_stack: true

# 俯视那一路只进视频；感知仍然只看腕机（`perception_cam`），所以「能看见盒子在哪」
# 这件事没有多给一条路。
cams:
  - sim_overhead
  - sim_wrist

perception_cam: sim_wrist
perception: brown_rect
policy: real
judge: held
goal: grasp

rounds: 1
seed: 0
max_attempts: 1

attempt_seconds: 900
round_seconds: 3600

objects:
  - shape: cube
    color: red
    side_mm: 20

# 真机现场的两个常数。`table_z_mm` 仿真里就是 0（nexus 那个场景的地面）；
# `pick_xy_mm` 逐字照抄 `configs/real.yaml` —— 真机上的拾取工位。
real:
  table_z_mm: 0
  pick_xy_mm: [227, 68]
